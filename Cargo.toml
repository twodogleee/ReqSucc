[package]
name = "reqsucc"
version = "0.4.0"
edition = "2024"
description = "全中文本地 API 调试工作台"
authors = ["Andersen <twodoglee@msn.com>"]
license = "Apache-2.0"
repository = "https://github.com/twodogleee/ReqSucc"
readme = "README.md"

[[bin]]
name = "reqsucc"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["tree-sitter"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["macros", "time", "sync", "fs", "io-util", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
encoding_rs = "0.8"
url = "2"
dirs = "6"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
