[package]
name = "reqsucc"
version = "0.4.1"
edition = "2024"
description = "全中文本地 API 调试工作台"
authors = ["Andersen <twodoglee@msn.com>"]
license = "Apache-2.0"
repository = "https://github.com/twodogleee/ReqSucc"
readme = "README.md"

[[bin]]
name = "reqsucc"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["tree-sitter"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["macros", "time", "sync", "fs", "io-util", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
url = "2"
dirs = "6"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rdkafka = { version = "=0.39.0", features = ["ssl-vendored", "libz-static"] }

# Windows 使用 MSVC/CMake 构建 Kafka，其他平台保留现有构建方式。
[target.'cfg(target_os = "windows")'.dependencies]
rdkafka = { version = "=0.39.0", features = ["cmake-build"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
core-text = { path = "vendor/core-text" }
