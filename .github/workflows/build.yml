# 日常提交验证双平台；手动运行只提供验收包；版本标签成功后发布成品。
name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.95.0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            shell: pwsh
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 配置 macOS 最低部署版本
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: 配置 MSVC x64 环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 配置 OpenSSL 与 Kafka 构建工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM 安装失败' }
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (!(Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { throw '未找到 Windows 原生 Perl' }
          'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Git Bash 的同名 link.exe 不是 MSVC 链接器；同时固定 Cargo 配置和子进程搜索路径。
          if (!$env:VCToolsInstallDir) { throw 'MSVC 环境未初始化' }
          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $msvcLink = Join-Path $msvcBin 'link.exe'
          if (!(Test-Path $msvcLink)) { throw '未找到 MSVC x64 链接器' }
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 安装锁定工具链
        run: rustup toolchain install '${{ env.RUSTUP_TOOLCHAIN }}' --profile minimal --component rustfmt --target '${{ matrix.target }}'
      - name: 验证 Windows 链接工具链
        if: runner.os == 'Windows'
        run: |
          # Windows 可返回多个同名程序，只校验 PATH 中优先执行的第一项。
          $resolvedLink = (Get-Command link.exe -CommandType Application | Select-Object -First 1).Source
          if ($resolvedLink -ne $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER) {
            throw "链接器路径错误：$resolvedLink"
          }
          Write-Host "MSVC linker: $resolvedLink"
          # 显式目标构建仍会编译宿主构建脚本，先验证默认宿主链接也可用。
          $probeSource = Join-Path $env:RUNNER_TEMP 'reqsucc_link_check.rs'
          $probeBinary = Join-Path $env:RUNNER_TEMP 'reqsucc_link_check.exe'
          'fn main() {}' | Set-Content -Path $probeSource -Encoding utf8
          rustc --crate-name reqsucc_link_check $probeSource -o $probeBinary
          if ($LASTEXITCODE -ne 0) { throw 'Rust 宿主链接检查失败' }
          & $probeBinary
          if ($LASTEXITCODE -ne 0) { throw 'Rust 宿主程序启动失败' }
      - name: 缓存依赖下载
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: 校验版本和脚本
        # 此步骤只校验元数据、Python 和格式；保留 Bash 的逐条失败退出语义。
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python scripts/release.py metadata --tag "$RELEASE_TAG"
          python -m unittest discover -s scripts -p 'test_*.py'
          cargo fmt --check
      - name: 测试
        run: cargo test --locked --target '${{ matrix.target }}'
      - name: 测试 macOS 字体兼容补丁
        if: runner.os == 'macOS'
        run: cargo test --locked -p core-text reqsucc_font_traits_tests --target '${{ matrix.target }}'
      - name: 构建开发版本
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: cargo build --locked --target '${{ matrix.target }}'
      - name: 构建正式版本
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: 打包正式版本
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python scripts/release.py package --platform '${{ matrix.platform }}' --binary-dir 'target/${{ matrix.target }}/release'
      - name: 保存验收产物
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  distribution:
    name: 汇总与分发
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: target/dist
      - name: 校验成品完整性
        run: python scripts/release.py checksums
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: target/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: 发布 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python scripts/release.py metadata --tag "$RELEASE_TAG"
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" target/dist/*.zip target/dist/SHA256SUMS.txt \
            --verify-tag --title "ReqSucc $RELEASE_TAG" --generate-notes "${options[@]}"
